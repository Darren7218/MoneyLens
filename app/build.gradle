plugins { id 'com.android.application' }
android {
    namespace 'app.moneylens'
    compileSdk 35
    buildToolsVersion "35.0.0"
    lint { checkReleaseBuilds false }
    defaultConfig { applicationId 'app.moneylens'; minSdk 28; targetSdk 35; versionCode 2; versionName '0.2.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs { preview { storeFile rootProject.file('build/moneylens-preview.jks'); storePassword 'android'; keyAlias 'moneylens'; keyPassword 'android' } }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.preview } }
}
dependencies {
    implementation 'androidx.annotation:annotation:1.8.1'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
