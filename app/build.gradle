plugins { id 'com.android.application' }
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
// Release keystore lives outside build/ so `gradlew clean` can never delete it.
// Falls back to the legacy location for older checkouts.
def releaseStore = localProps.getProperty('moneylens.storeFile') ?: 'build/moneylens-preview.jks'
android {
    namespace 'app.moneylens'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'app.moneylens'; minSdk 28; targetSdk 35; versionCode 17; versionName '0.17.0'; ndk { abiFilters 'arm64-v8a', 'x86_64' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        preview {
            storeFile file(releaseStore)
            storePassword localProps.getProperty('moneylens.storePassword', 'android')
            keyAlias localProps.getProperty('moneylens.keyAlias', 'moneylens')
            keyPassword localProps.getProperty('moneylens.keyPassword', 'android')
        }
    }
    // Personal sideload build: signed with the local debug key so it updates in place.
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
dependencies {
    implementation 'androidx.annotation:annotation:1.8.1'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
